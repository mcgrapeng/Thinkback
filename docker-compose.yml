services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thinkback-app
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app/src
      ENVIRONMENT: development
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      QDRANT_URL: ${QDRANT_URL:-https://qdrant.example.internal}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    env_file:
      - path: .env
        required: false
    depends_on:
      - postgres
      - redis
    networks:
      - thinkback-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thinkback-worker
    command: ["celery", "-A", "infra.tasks.celery_app.celery_app", "worker", "-l", "info"]
    environment:
      PYTHONPATH: /app/src
      ENVIRONMENT: development
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      QDRANT_URL: ${QDRANT_URL:-https://qdrant.example.internal}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    env_file:
      - path: .env
        required: false
    depends_on:
      - postgres
      - redis
    networks:
      - thinkback-network

  postgres:
    image: postgres:18.3
    container_name: thinkback-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DATABASE:-thinkback}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - thinkback-network

  redis:
    image: redis:7.4.8-alpine
    container_name: thinkback-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - thinkback-network

volumes:
  postgres-data:
  redis-data:

networks:
  thinkback-network:
    driver: bridge
