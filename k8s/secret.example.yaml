apiVersion: v1
kind: Secret
metadata:
  name: thinkback-secret
type: Opaque
stringData:
  # PostgreSQL 密码
  # PostgreSQL 密码，生产必须替换为 Secret 管理系统中的真实值。
  POSTGRES_PASSWORD: postgres


  # Milvus 认证信息
  # Milvus 用户名，无鉴权时可为空。
  MILVUS_USER: ""
  # Milvus 密码，无鉴权时可为空。
  MILVUS_PASSWORD: ""

  # LLM 和 Embedding 认证信息
  # LLM API key，生产必须替换为真实 Secret。
  OPENAI_API_KEY: ""
  # Embedding API key，当前 endpoint 不需要鉴权时可为空。
  MEMORY_EMBEDDING_API_KEY: ""
