apiVersion: v1
kind: Secret
metadata:
  name: thinkback-secret
type: Opaque
stringData:
  # PostgreSQL 密码
  # PostgreSQL 密码，生产必须替换为 Secret 管理系统中的真实值。
  POSTGRES_PASSWORD: postgres

  # 治理台 /admin/api/* 的共享 Bearer token
  # 生产**必须**配置：空 token 时 /admin/api/* 会放行（fail-open），
  # 而 ENVIRONMENT=production 时缺这一项服务会直接启动失败（fail fast）。
  # 生成方式：python -c "import secrets; print(secrets.token_urlsafe(32))"
  ADMIN_TOKEN: ""

  # Milvus 认证信息
  # Milvus 用户名，无鉴权时可为空。
  MILVUS_USER: ""
  # Milvus 密码，无鉴权时可为空。
  MILVUS_PASSWORD: ""

  # LLM 和 Embedding 认证信息
  # LLM API key（可选），生产必须替换为真实 Secret。
  MEMORY_LLM_KEY: ""
  # Embedding API key（可选），endpoint 不需要鉴权时可为空。
  MEMORY_EMBEDDING_API_KEY: ""
