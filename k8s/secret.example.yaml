apiVersion: v1
kind: Secret
metadata:
  name: thinkback-secret
type: Opaque
stringData:
  # 中文注释：示例 Secret 只用于说明字段，真实集群请替换为平台密钥管理产物。
  # 中文注释：PostgreSQL 密码。
  POSTGRES_PASSWORD: postgres
  # 中文注释：Redis 密码；无密码 Redis 可留空。
  REDIS_PASSWORD: ""
  # 中文注释：Qdrant 鉴权密钥；生产远端 Qdrant 应配置。
  QDRANT_API_KEY: ""
  # 中文注释：模型服务密钥；OpenAI 和 OpenAI-compatible endpoint 都使用这个变量。
  OPENAI_API_KEY: ""
