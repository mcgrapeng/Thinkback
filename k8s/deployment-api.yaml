apiVersion: apps/v1
kind: Deployment
metadata:
  name: thinkback-api
  labels:
    app: thinkback
    component: api
spec:
  # 单副本：进程内状态（API Key 表、幂等缓存、限流桶、L1 缓存）没有跨副本共享。
  # 多副本下同一用户换个 Pod 就换一份记忆（L1 缓存无跨副本失效，已加 TTL 兜底），
  # pod A 签发的 key 在 pod B 上查不到、限流额度实际翻倍。
  # 要扩副本先把进程内状态挪到共享存储（Redis/PG），再改这里。
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: thinkback
      component: api
  template:
    metadata:
      labels:
        app: thinkback
        component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: thinkback-api
          image: thinkback:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
            - containerPort: 50051
          env:
            - name: PYTHONPATH
              value: /app/src
            - name: TMPDIR
              value: /tmp/thinkback
          envFrom:
            - configMapRef:
                name: thinkback-config
            - secretRef:
                name: thinkback-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp/thinkback
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir: {}
