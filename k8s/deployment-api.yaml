apiVersion: apps/v1
kind: Deployment
metadata:
  name: thinkback-api
  labels:
    app: thinkback
    component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: thinkback
      component: api
  template:
    metadata:
      labels:
        app: thinkback
        component: api
    spec:
      serviceAccountName: thinkback
      securityContext:
        runAsNonRoot: true
      containers:
        - name: thinkback-api
          image: thinkback:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: PYTHONPATH
              value: /app/src
          envFrom:
            - configMapRef:
                name: thinkback-config
            - secretRef:
                name: thinkback-secret
          volumeMounts:
            - name: mem0-history
              mountPath: /app/.mem0
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: mem0-history
          emptyDir: {}
