apiVersion: v1
kind: ConfigMap
metadata:
  name: thinkback-config
data:
  # 应用基础配置
  # 应用名称，日志、健康检查和部署识别使用。
  APP_NAME: thinkback
  # 应用版本，应与镜像版本或发布版本保持一致。
  APP_VERSION: "0.1.0"
  # 运行环境，生产必须为 production，用于禁用本地 .env 读取。
  ENVIRONMENT: production
  # 是否开启调试模式，生产必须关闭。
  DEBUG: "false"
  # 日志级别，生产默认 INFO。
  LOG_LEVEL: INFO

  # PostgreSQL 数据库配置
  # PostgreSQL 主机地址，生产应替换为真实数据库地址。
  POSTGRES_HOST: postgres
  # PostgreSQL 端口。
  POSTGRES_PORT: "5432"
  # PostgreSQL 用户名。
  POSTGRES_USER: postgres
  # PostgreSQL 数据库名，当前固定为 thinkback。
  POSTGRES_DATABASE: thinkback

  # Milvus 向量库配置
  # Milvus 服务地址，生产不要使用 localhost。
  MILVUS_URL: http://milvus.example.internal:19530
  # Milvus database 名称。
  MILVUS_DATABASE: default

  # LLM 和 Embedding 配置
  # OpenAI-compatible LLM endpoint 地址。
  MEMORY_LLM_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
  # OpenAI-compatible Embedding endpoint 地址。
  MEMORY_EMBEDDING_BASE_URL: http://embedding.example.internal:7345/v1
  # Mem0 写入 Milvus 的 collection 名称。
  MEMORY_MILVUS_COLLECTION: thinkback
  # Embedding 向量维度，必须与 embedding 服务输出一致。
  MEMORY_EMBEDDING_DIMS: "1024"
  # LLM 模型名称。
  MEMORY_LLM_MODEL: qwen-plus-latest
  # Embedding 模型名称。
  MEMORY_EMBEDDING_MODEL: default-embedding

  # 记忆服务运行参数
  # Mem0 Library 本地历史数据库路径，需要挂载可写目录。
  MEM0_HISTORY_DB_PATH: /tmp/thinkback/mem0/history.db
  # L3 写入模式，async 表示后台抽取长期记忆。
  MEMORY_L3_WRITE_MODE: async
  # API 同步工作线程并发上限。
  MEMORY_API_WORKER_LIMIT: "8"
  # API 同步工作进入 worker 并等待返回的总时间窗口，单位秒。
  MEMORY_API_WORKER_WAIT_SECONDS: "5"
  # L3 后台抽取线程数。
  MEMORY_L3_EXECUTOR_WORKERS: "16"
  # L3 后台写入队列容量。
  MEMORY_L3_MAX_PENDING_TASKS: "256"
  # L3 队列满前的最长等待秒数。
  MEMORY_L3_QUEUE_WAIT_SECONDS: "5"
  # Mem0 Library 后端调用并发上限。
  MEMORY_BACKEND_MAX_CONCURRENT_CALLS: "4"

  # 就绪检查配置
  # 单个依赖 readiness 检查超时时间，单位秒。
  READINESS_TIMEOUT_SECONDS: "3"
