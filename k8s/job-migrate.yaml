apiVersion: batch/v1
kind: Job
metadata:
  name: innies-memory-migrate
  labels:
    app: innies-memory
    component: migrate
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: innies-memory
        component: migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: innies-memory-migrate
          image: innies-memory:0.1.0
          imagePullPolicy: IfNotPresent
          command:
            - alembic
            - upgrade
            - head
          env:
            - name: PYTHONPATH
              value: /app/src
            - name: TMPDIR
              value: /tmp/innies-memory
          envFrom:
            - configMapRef:
                name: innies-memory-config
            - secretRef:
                name: innies-memory-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp/innies-memory
      volumes:
        - name: tmp
          emptyDir: {}
