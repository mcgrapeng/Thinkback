syntax = "proto3";

package memory;

option py_generic_services = false;

// ─── Enums ────────────────────────────────────────────────────────────────────

enum MessageRole {
  MESSAGE_ROLE_USER = 0;
  MESSAGE_ROLE_ASSISTANT = 1;
  MESSAGE_ROLE_SYSTEM = 2;
  // 工具结果。v2 的角色集合是 user / assistant / tool / system：工具结果与
  // 单向事实是企业助手的实际形态。哪类角色能成为某个记忆类型的事实，
  // 由类型的 source_roles 决定，不在传输层限制。
  MESSAGE_ROLE_TOOL = 3;
}

enum MemoryType {
  MEMORY_TYPE_PROFILE = 0;
  MEMORY_TYPE_PREFERENCE = 1;
  MEMORY_TYPE_EVENT = 2;
  MEMORY_TYPE_PLAN = 3;
  MEMORY_TYPE_CONSTRAINT = 4;
}

enum MemoryStatus {
  MEMORY_STATUS_ACTIVE = 0;
  MEMORY_STATUS_DELETED = 1;
  MEMORY_STATUS_SUPPRESSED = 2;
  MEMORY_STATUS_SUPERSEDED = 3;
}

enum SourceType {
  SOURCE_TYPE_CHAT_ROUND = 0;
  SOURCE_TYPE_SESSION_REBUILD = 1;
  SOURCE_TYPE_MANUAL_FIX = 2;
  SOURCE_TYPE_IMPORT = 3;
  SOURCE_TYPE_SYSTEM_MIGRATION = 4;
}

enum DataClassification {
  DATA_CLASSIFICATION_NORMAL = 0;
  DATA_CLASSIFICATION_PERSONAL = 1;
  DATA_CLASSIFICATION_SENSITIVE = 2;
  DATA_CLASSIFICATION_RESTRICTED = 3;
}

enum SummaryState {
  SUMMARY_STATE_ACTIVE = 0;
  SUMMARY_STATE_STALE = 1;
  SUMMARY_STATE_DIRTY = 2;
  SUMMARY_STATE_REBUILDING = 3;
}

enum TaskStatus {
  TASK_STATUS_PENDING = 0;
  TASK_STATUS_RUNNING = 1;
  TASK_STATUS_COMPLETED = 2;
  TASK_STATUS_FAILED = 3;
  TASK_STATUS_DEAD_LETTER = 4;
}

enum OperationType {
  OPERATION_TYPE_WRITE_ROUND = 0;
  OPERATION_TYPE_UPDATE_MEMORY = 1;
  OPERATION_TYPE_DELETE_MEMORY = 2;
  OPERATION_TYPE_DELETE_SESSION = 3;
  OPERATION_TYPE_DELETE_ALL = 4;
  OPERATION_TYPE_REBUILD_L2 = 5;
  OPERATION_TYPE_REBUILD_L3 = 6;
  // 物理擦除（原文不可恢复）。新增编号，不复用既有值。
  OPERATION_TYPE_ERASE = 7;
}

enum DeleteScope {
  DELETE_SCOPE_MEMORY = 0;
  DELETE_SCOPE_SESSION = 1;
  DELETE_SCOPE_ALL = 2;
}

// ─── Messages ─────────────────────────────────────────────────────────────────

message MemoryMessage {
  string message_id = 1;
  MessageRole role = 2;
  string content = 3;
  string timestamp = 4;  // ISO 8601
}

// ─── v2 写入契约：一次 append 一条原始事件 ─────────────────────────────────
//
// 与 HTTP 的 /v2/memory/events 同形（ADR-0008：一次 append 一条事件，事件 ID
// 同时是幂等锚点）。v1 的 AppendRequest（"一轮多消息"）已撤掉：它与 HTTP 的
// v2 契约分叉，按 ADR-0011（契约直接替换，不并存）不留兼容形状。

message SourceEvent {
  string event_id = 1;   // 全局唯一，同时是幂等锚点
  string source = 2;     // chat_round / tool_result / import …
  MessageRole role = 3;  // user / assistant / tool / system
  string payload = 4;    // 事件正文
  string occurred_at = 5;  // ISO 8601，事件在源头发生的时间
  optional string subject_ref = 6;  // 缺省即 user_id
  map<string, string> provenance = 7;  // 来源链路信息
}

message AppendEventRequest {
  string request_id = 1;
  string user_id = 2;
  string session_id = 3;
  SourceEvent event = 4;
  string namespace = 5;  // 记忆作用域标签；空值按 "thinkback" 处理
  optional string memory_type = 6;  // 该 namespace 已注册的类型名
  optional int32 round_index = 7;
  map<string, string> metadata = 8;
}

message AppendEventResponse {
  string status = 1;
  string task_id = 2;
  string round_id = 3;
  repeated string l3_events = 4;  // JSON-encoded event summaries
}

message RecallRequest {
  string user_id = 1;
  string session_id = 2;
  string query = 3;
  // 字段 4 原为 RecallIntent intent：该轴在域模型里已删除（枚举只剩两个值，
  // SENSITIVE 无条件报错，是 fail-useless 不是 fail-closed），语义不再分叉。
  reserved 4;
  int32 l3_limit = 5;
  float l3_score_threshold = 6;
  int32 token_budget = 7;
  string namespace = 8;  // 记忆作用域标签；空值按 "thinkback" 处理
}

message MemoryItem {
  string layer = 1;
  string content = 2;
  string source = 3;
  optional string memory_id = 4;
  optional float score = 5;
  map<string, string> metadata = 6;
}

message RecallResponse {
  string status = 1;
  bool degraded = 2;
  repeated string degradation_reasons = 3;
  repeated MemoryItem items = 4;
}

message DeleteRequest {
  string request_id = 1;
  string user_id = 2;
  DeleteScope scope = 3;
  string operation_id = 4;
  optional string memory_id = 5;
  optional string session_id = 6;
  string namespace = 7;  // 记忆作用域标签；空值按 "thinkback" 处理
}

message DeleteResponse {
  string status = 1;
  string task_id = 2;
  int32 affected_memories = 3;
  optional SummaryState summary_state = 4;
}

// 逻辑下架与物理擦除：与 HTTP /memory/suppress、/memory/erase 同义。
message SuppressRequest {
  string request_id = 1;
  string user_id = 2;
  DeleteScope scope = 3;
  string operation_id = 4;
  optional string memory_id = 5;
  optional string session_id = 6;
  string namespace = 7;
}

message SuppressResponse {
  string status = 1;
  string task_id = 2;
  int32 affected_memories = 3;
  optional SummaryState summary_state = 4;
}

message EraseRequest {
  string request_id = 1;
  string user_id = 2;
  DeleteScope scope = 3;
  string operation_id = 4;
  optional string memory_id = 5;
  optional string session_id = 6;
  string namespace = 7;
}

message EraseResponse {
  string status = 1;
  string task_id = 2;
  int32 affected_memories = 3;
  optional SummaryState summary_state = 4;
}

message ListMemoriesRequest {
  string user_id = 1;
  bool include_deleted = 2;
  string namespace = 3;  // 记忆作用域标签；空值按 "thinkback" 处理
}

message ManagedMemoryItem {
  string memory_id = 1;
  string content = 2;
  MemoryStatus status = 3;
  SourceType source_type = 4;
  DataClassification data_classification = 5;
  optional MemoryType memory_type = 6;
  repeated string backend_categories = 7;
  // 完整的记忆类型名。自定义类型（state/commitment/行业类型）不在
  // MemoryType 枚举里，旧字段会把它静默变成 UNSET —— 用这个字段承载
  // namespace 类型注册表里的原始类型名。
  string memory_type_name = 8;
}

message ListMemoriesResponse {
  string status = 1;
  repeated ManagedMemoryItem items = 2;
}

message GetMemoryRequest {
  string memory_id = 1;
  string user_id = 2;
  string namespace = 3;  // 记忆作用域标签；空值按 "thinkback" 处理
}

message GetMemoryResponse {
  string status = 1;
  ManagedMemoryItem memory = 2;
}

message UpdateMemoryRequest {
  string request_id = 1;
  string user_id = 2;
  string operation_id = 3;
  string memory_id = 4;
  string content = 5;
  optional MemoryType memory_type = 6;
  string namespace = 7;  // 记忆作用域标签；空值按 "thinkback" 处理
  // 完整类型名（自定义类型用）。与 memory_type 同时给出时以此为准。
  string memory_type_name = 8;
}

message UpdateMemoryResponse {
  string status = 1;
  string task_id = 2;
  ManagedMemoryItem memory = 3;
  optional SummaryState summary_state = 4;
}

message RebuildRequest {
  string request_id = 1;
  string user_id = 2;
  string operation_id = 3;
  optional string session_id = 4;
  optional string history_version = 5;
  bool rebuild_l2 = 6;
  bool rebuild_l3 = 7;
  string namespace = 8;  // 记忆作用域标签；空值按 "thinkback" 处理
}

message RebuildResponse {
  string status = 1;
  string task_id = 2;
  bool rebuilt_l2 = 3;
  bool rebuilt_l3 = 4;
}

message GetTaskRequest {
  string task_id = 1;
}

message TaskResponse {
  string task_id = 1;
  string request_id = 2;
  OperationType op_type = 3;
  TaskStatus status = 4;
  string scope = 5;  // JSON-encoded scope dict
  optional string last_error = 6;
  string result = 7;  // JSON-encoded result dict
  // 已重试次数。客户端据此判断是否接近重试预算上限。
  int32 retry_count = 8;
}

message L3BackgroundStatusRequest {}

message L3BackgroundStatusResponse {
  string write_mode = 1;
  int32 executor_workers = 2;
  int32 max_pending_tasks = 3;
  int32 pending_write_tasks = 4;
  int32 cleanup_tasks = 5;
  int32 available_capacity = 6;
}

// ─── Service ──────────────────────────────────────────────────────────────────

service MemoryService {
  // v2 写入契约：一次一条原始事件（与 HTTP /v2/memory/events 同形）。
  rpc AppendEvent(AppendEventRequest) returns (AppendEventResponse);
  rpc Recall(RecallRequest) returns (RecallResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  // 逻辑下架：不可召回，保留原文与墓碑。
  rpc Suppress(SuppressRequest) returns (SuppressResponse);
  // 物理擦除：原文不可恢复。
  rpc Erase(EraseRequest) returns (EraseResponse);
  rpc ListMemories(ListMemoriesRequest) returns (ListMemoriesResponse);
  rpc GetMemory(GetMemoryRequest) returns (GetMemoryResponse);
  rpc UpdateMemory(UpdateMemoryRequest) returns (UpdateMemoryResponse);
  rpc Rebuild(RebuildRequest) returns (RebuildResponse);
  rpc GetTask(GetTaskRequest) returns (TaskResponse);
  rpc GetL3BackgroundStatus(L3BackgroundStatusRequest) returns (L3BackgroundStatusResponse);
}
