[project]
name = "thinkback"
version = "0.1.0"
description = "Memory service for conversations (Thinkback)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.135.2,<0.163",
    "uvicorn[standard]>=0.43.0,<0.44",
    "pydantic>=2.12.5,<3",
    "pydantic-settings>=2.13.1,<3",
    "sqlalchemy[asyncio]>=2.0.49,<3",
    "asyncpg>=0.30.0,<0.31",
    "greenlet>=3.5.0,<4",
    "alembic>=1.18.4,<2",
    "loguru>=0.7.2,<0.8",
    "openai>=2.12.0,<3",
    "httpx>=0.28.0,<0.29",
    "python-dotenv>=1.0.0,<2",
    "mem0ai==2.2.1",
    "pymilvus>=3.0.0,<4",
    "grpcio>=1.60,<2.0",
    "grpcio-reflection>=1.60,<2.0",
    "mcp>=1.2,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0",
    "pytest-mock>=3.14.0,<4",
    "pytest-cov>=6.0,<7",
    "ruff>=0.9,<1.0",
    "mypy>=1.14.0,<2",
    "grpcio-tools>=1.60,<2.0",
    "aiosqlite>=0.22.1",
    "mutmut>=3.8.0",
    "hypothesis>=6.168.5",
    # 解析 pytest 的 junit 报告用（用例防回血基线）。stdlib 的 ElementTree
    # 不做实体展开防护，用 defusedxml 免掉 XXE / billion laughs。
    "defusedxml>=0.7.1",
    "pytest-testmon>=2.2.0",
    "pip-audit>=2.10.1",
    # e2e 驱动：声明为 dev 依赖，`make test-e2e` 才在干净环境可跑。
    "playwright>=1.49.0",
    "schemathesis>=4.30.1",
]

[project.scripts]
thinkback-mcp = "thinkback.mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thinkback"]

[tool.ruff]
line-length = 100
target-version = "py312"
# mutmut 生成的变异树（make mutation-audit 产物）不参与格式/静态检查
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ASYNC", "ARG", "SIM"]
ignore = ["E501", "B008", "B904", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# 测试允许未使用的 fixture 参数与裸断言。
"tests/**/*" = ["ARG", "S101"]
"src/thinkback/rpc/memory_pb2.py" = ["ALL"]
"src/thinkback/rpc/memory_pb2.pyi" = ["ALL"]
"src/thinkback/rpc/memory_pb2_grpc.py" = ["ALL"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["thinkback"]
ignore_missing_imports = true
exclude = "^mutants/"

[[tool.mypy.overrides]]
module = [
    "thinkback.rpc.memory_pb2",
    "thinkback.rpc.memory_pb2_grpc",
]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
# 默认套件只含确定性用例；tests/e2e 由 make test-e2e 显式运行（要起前端）。
testpaths = ["tests/unit"]
python_functions = ["test"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.coverage.run]
# protoc 生成代码不计入覆盖率（其正确性由编译器与测试间接保证）
omit = [
    "src/thinkback/rpc/memory_pb2.py",
    "src/thinkback/rpc/memory_pb2_grpc.py",
]

[tool.mutmut]
# 变异测试审计范围：小而纯的逻辑模块。source_paths 必须整棵 src
# （mutants 树要能 import 完整包），用 only_mutate 收窄变异目标。
#
# service.py（6000+ 行）**不进**变异范围 —— 这里原先写着「全量变异留给
# CI 夜间任务」，但那条任务从来不存在：ci.yml 的 nightly-full 跑的是
# make check，与 PR 门禁是同一个范围。按上面的收窄标准，整份 service.py
# 进范围会产生上千个「日志文案变了」的噪音变异体，稀释门禁信噪比。
# service.py 里真正决定结果的部分由两条路覆盖：
#   1. 能下沉成纯函数的，已下沉到 domain/ 并进了下面的 only_mutate；
#   2. 下沉不了的（冲突策略回落 / 索引生命周期 / 重建覆盖判定 / 删除截止），
#      由 tests/unit/test_service_core_decisions.py 的契约用例钉住。
#
# 收窄标准：**纯函数 + 有判定分支**。这类模块的变异体才代表真实缺陷
# （比较方向翻转、阈值差一、份额写反）；胶水代码的变异体只会是
# 「日志文案变了」这种噪音，登记成存活只会稀释门禁的信噪比。
#
# recall_policy 是记忆系统里逻辑最密的一块（去重 / 槽位仲裁 / 预算分配 /
# 逐层裁剪），此前**一个变异体都没有** —— 第四轮审计把它列成了缺口。
#
# domain/slots/canonical.py 是同一类东西：规范化文本 + 冲突槽位判定，
# 也就是「什么算一条冲突事实」的共用口径。它同样是纯函数 + 判定分支，
# 同样此前**一个变异体都没有** —— 第五轮审计补进来。
#
# domain/slots/support.py、domain/content_quality.py、domain/entities.py、
# domain/memory_types.py **这一轮还没进来**：它们的存活变异体绝大多数是
# 词表项（别名/依据词/marker）与诊断文案。前者要逐条钉死（每条表项一个
# 只命中它的样例），后者是刻意不钉死的诊断输出 —— 两者合起来是几百条登记，
# 登记成存活正是上面说的「稀释门禁信噪比」。support.py 的昵称与沟通偏好
# 依据词已经先补成用例（tests/unit/test_source_support_gap_contract.py），
# 其余四个模块的补齐是独立一轮的工作。
# （第七轮更新：support.py 的**判定逻辑**已拆到 source_order.py 并放回范围，
# entities.py 也放回范围，理由见下方；support.py 剩下的依据词表仍不进范围。）

# domain/slots/extractors.py **进了**变异范围（第十轮），但它的**措辞表**
# 被搬了出去（第十一轮重构）：措辞表（约 120 条正则 + 约 85 个闸门词）
# 是**数据**不是判定逻辑，而这些正则彼此重叠（一句 "preferred name from
# Bob to Carol" 同时命中 7 条正则：3 条 preferred name from X to Y + 4 条
# from X to Y）。mutmut 逐条改这些字面量，产出的大多是「等价变异」
# （大小写 / XX 包裹）—— 那是噪音不是缺陷信号，登记成存活只会稀释门禁的
# 信噪比。措辞表搬进 domain/slots/_vocabulary.py（do_not_mutate 排除），
# 内容由 golden 用例逐条钉死（tests/unit/test_slot_vocabulary_golden.py：
# 每条措辞配一个样例，钉住「模式仍命中」+「抽取输出不变」）。留在变异
# 范围里的是抽取器的**判定分支**（闸门、末次匹配、取值清洗）—— 那才是
# 改坏了就是真实缺陷的部分。
#
# memory/schemas.py **故意不进来**：它是 pydantic 模型定义，mutmut 会把
# Field(description=...) / 报错文案 / 正则串全变一遍 —— 那些变异体绝大多数
# 是「文案变了」，与行为无关。而它里面真正决定行为的**校验器**（空 ID、
# namespace 形状、metadata 上限、删除范围互斥、预算越界）改坏时全是真实
# 缺陷 —— 这一层用逐条契约用例钉死
# （见 tests/unit/test_schemas_validation_contract.py），不进变异审计。
#
# api/idempotency.py **进了**变异范围（第六轮）：它的判定分支（重放 / 冲突 /
# 分域 / TTL / LRU / 成功码边界）改坏时全是真实缺陷 —— 「同 key 不同 body
# 不报冲突」= 写路径上同一把 key 能把写操作执行两次，代价是重复记忆。
# 措辞表（错误文案、响应头名）那一部分变异体是「文案变了」，与行为无关，
# 逐条登记只会稀释门禁信噪比，按下面的「刻意不钉死」处理。
#
# domain/slots/source_order.py **这一轮进范围**（第七轮）：它是「哪个来源
# 更新」「这条记忆是不是同源」「抽取闸门放不放行」的判据 —— 排序游标、
# 同源判定、来源时间解析、抽取字节阈值。写反了线上表现是「用户改了偏好，
# 系统还在用旧的那条」，必须由变异审计看守。
# 它是从 domain/slots/support.py 拆出来的：support.py 里混着两类东西 ——
# **判定逻辑**（进范围）与**依据词表**（不进范围）。词表项被改写是「措辞
# 调整」，逐条钉死就变成覆盖率报表而不是缺陷信号；依据词表的**行为**
# 由逐条隔离的契约用例守着
# （tests/unit/test_source_marker_vocabulary.py、
# tests/unit/test_source_support_gap_contract.py、
# tests/unit/test_support_marker_isolation_contract.py）。
#
# domain/entities.py **这一轮进范围**（第七轮）：它是「事实是否过期」的
# 唯一口径，召回 / 列表 / 槽位回填三处都问它。9 条用例、纯函数、判定分支
# 极少 —— 收窄它没有信噪比收益，却丢掉了唯一的「改坏源码」保护。
#
# domain/content_quality.py 第十轮进范围（写入前的内容质量闸：判定分支
# 居多）；domain/memory_types.py 第十二轮进范围（类型注册表——租户配置
# 的信任边界，见下方 only_mutate 里的当轮注释）。两者历史上被排除的理由
# 是「变异体大面积落在展示文案/正则串上」—— content_quality 的判定分支
# 后来被判定为值得守；memory_types 则按门禁流程逐条登记存活者理由。
# 决定行为的契约用例同时钉着：
# - 质量分的精确值 → tests/unit/test_content_quality_contract.py
# - 类型策略与默认注册表 → tests/unit/test_memory_type_profile_validation.py
#   与 tests/unit/test_memory_types.py
#
# memory/l2_refresh.py 与 memory/l3.py **这一轮进范围**（第八轮）：它们是
# 「什么时候再跑一次 LLM」「队列还剩几个槽位」这两个决定**资源与新鲜度**
# 的地方，写错的线上表现全是静默的：
# - 去抖阈值差一 → 摘要每 N+1 轮才更新一次，用户以为系统没记住；
# - 失败不算「已尝试」 → LLM 挂掉期间每个 append 都重试，故障放大成调用风暴；
# - 槽位只进不出 → 队列预算被吃光，该 Pod 的写入能力永久归零；
# - drain 提前返回 → 调用方以为已关停，而记账还没做完。
# 两者都是「小而纯的判定」：去抖计数 / LRU 上界 / 容量闸门 / 槽位记账 /
# 关停预算，没有业务语义，变异体基本都对应真实缺陷。
# 它们的判定分支由精确值契约用例钉死
# （tests/unit/test_l2_refresh_decisions_contract.py、
# tests/unit/test_l3_executor_contract.py）。
source_paths = ["src"]
# mutmut 只把 source_paths / tests/ / pyproject.toml 等复制进 mutants/ 树。
# 仓库根的 profiles/（随包发布的类型 profile 与抽取指令）与 Dockerfile
# 是**数据 / 部署产物**，不复制过去的话：
# - mutants/tests/unit/test_memory_types.py 里 `Path(__file__).parents[2] / "profiles"`
#   指向 mutants/profiles —— 不存在，加载退回默认注册表，随包 profile 的用例必红；
# - mutants/tests/unit/test_memory_type_profile.py 用 `Path("Dockerfile")`（相对 cwd）
#   读镜像清单 —— cwd 是 mutants/，同样读不到。
# mutmut 的「先跑一遍干净基线」这一步直接失败，审计根本跑不起来。
also_copy = ["profiles", "Dockerfile"]
# mutmut 的超时 = (估算用时 + 1) × timeout_multiplier。估算值来自空载机器上的
# 单次测试耗时，而实际是 8 个 worker 并行跑 —— 墙钟时间会膨胀 3~5 倍。
# 倍数太小会出现**假超时**：明明跑完了、被判成 timeout，白白算成「没杀掉」。
# 60 倍给并行留够余量（单个体约 12~30 秒）。
timeout_multiplier = 60
only_mutate = [
    "src/thinkback/domain/keys.py",
    "src/thinkback/domain/summarization.py",
    "src/thinkback/domain/recall_policy.py",
    "src/thinkback/domain/dedup.py",
    "src/thinkback/domain/classification.py",
    "src/thinkback/domain/safety.py",
    "src/thinkback/domain/slots/canonical.py",
    "src/thinkback/domain/slots/query_slots.py",
    "src/thinkback/memory/decay.py",
    "src/thinkback/memory/task_state.py",
    "src/thinkback/memory/retention.py",
    "src/thinkback/memory/repositories/_l1_cache.py",
    "src/thinkback/infra/structured_logging.py",
    "src/thinkback/rpc/converters.py",
    "src/thinkback/api/idempotency.py",
    # 第七轮放回范围：来源仲裁与过期判定的唯一口径。
    "src/thinkback/domain/slots/source_order.py",
    "src/thinkback/domain/entities.py",
    # 第八轮：L2 刷新的去抖/失败语义 + L3 队列槽位记账与关停预算。
    "src/thinkback/memory/l2_refresh.py",
    "src/thinkback/memory/l3.py",
    # 第九轮：限流这条链（令牌桶原语 + HTTP 中间件 + gRPC 限流器）与多副本前置。
    # 四个模块决定「谁能写、写多快、什么算同一个调用方」——
    # 回填差一 → 限流比配置的松一倍；分桶口径错 → 租户互相挤兑；
    # 「限额变了不重置余额」破掉 → 改配置给每个桶发一次免费额度；
    # 天花板倍数错 → 轮换 user_id 就能绕开限流；
    # 多副本前置漏判 → 宣称多副本，实际上幂等与限流各算各的。
    # 此前这四个文件**一个变异体都没有**。
    "src/thinkback/infra/token_bucket.py",
    "src/thinkback/api/ratelimit.py",
    "src/thinkback/rpc/ratelimit.py",
    "src/thinkback/infra/replica_guard.py",
    # 第十轮：槽位抽取与内容质量 —— 「什么算一条记忆、哪两个槽位打架」。
    # 抽取器是 P0 冲突判定的地基（canonical / query_slots 都在范围里，
    # 但抽取器本身此前没有一条用例直接钉它）；
    # support 是槽位标记的公共词表与判定；
    # content_quality 是写入前的内容质量闸。
    "src/thinkback/domain/slots/extractors.py",
    "src/thinkback/domain/slots/support.py",
    "src/thinkback/domain/content_quality.py",
    # 第十二轮：类型注册表 —— 租户提交的配置能不能生效、属性名冲突键判据，
    # 都在这一个文件里。插件形态下它是**最靠近外部输入的信任边界**
    # （profile 由部署方/企业下发）。历史上没进范围是担心诊断文案变异体
    # 稀释信噪比；存活者按门禁流程逐条登记理由（详见当轮审计报告）。
    "src/thinkback/domain/memory_types.py",
]
# 词表是**数据**不是逻辑：单独一个模块，逐条改字面量产出的是「等价变异」
# （大小写 / XX 包裹），不是缺陷信号。抽出来之后用 golden 用例逐条钉死
# （tests/unit/test_slot_vocabulary_golden.py），变异审计留给真正的判定分支。
# mutmut 的 should_mutate =「在 only_mutate 里」且「不在 do_not_mutate 里」，
# 两边口径要对齐（tests/eval/refresh_mutation_stats.py::in_scope 同口径）。
do_not_mutate = [
    "src/thinkback/domain/slots/_vocabulary.py",
]
pytest_add_cli_args_test_selection = [
    "tests/unit/test_memory_decay.py",
    "tests/unit/test_memory_repositories.py",
    "tests/unit/test_repository_contract.py",
    "tests/unit/test_domain_pure_functions.py",
    "tests/unit/test_l2_llm_summary.py",
    # L2 摘要解析器（memory/l2_refresh.parse_summary_sections）的逐条契约：
    # JSON 路径 / 【】路径 / 两者之间的回退条件。
    "tests/unit/test_l2_summary_parser_contract.py",
    "tests/unit/test_recall_policy.py",
    "tests/unit/test_recall_policy_properties.py",
    "tests/unit/test_recall_policy_contract.py",
    # 类型级 token 上限（type_caps）只在这里被断言 —— 不选它，
    # recall_policy 里 metadata/memory_type 那条分支的变异体全部存活。
    "tests/unit/test_memory_recall_budget.py",
    "tests/unit/test_memory_lifecycle_properties.py",
    "tests/unit/test_memory_retention.py",
    "tests/unit/test_retention_contract.py",
    "tests/unit/test_task_state.py",
    "tests/unit/test_safety_gate_patterns.py",
    "tests/unit/test_safety_gate_policy.py",
    "tests/unit/test_classification_contract.py",
    "tests/unit/test_structured_logging.py",
    "tests/unit/test_domain_dedup.py",
    # 第十一轮：对抗性审计修的 8 条缺陷 —— 去重键的小数点、decay 的判龄时钟、
    # gRPC 的未知枚举、限流的查询串分桶、L1 缓存窗口与读穿透收尾、两个仓储
    # 的空过滤参数。不选它，这些模块的新变异体全部存活 —— 门禁看到的是一片红，
    # 实际是用例没被选中。
    "tests/unit/test_round11_audit_findings.py",
    # 槽位抽取与规范化的变异目标在 domain/slots/ 下：不选上对应的用例，
    # canonical/extractors 的变异体会因为「选择集里没有能杀它的用例」而
    # 全部存活 —— 门禁看到的是一片红，实际是用例没被选中。
    "tests/unit/test_p0_source_support_gate.py",
    "tests/unit/test_slot_canonical_contract.py",
    "tests/unit/test_slot_extraction_real.py",
    "tests/unit/test_slot_extraction_chinese_nickname.py",
    "tests/unit/test_slot_extraction_chinese_preferences.py",
    # 查询侧槽位与 gRPC 转换层：query_slots 的槽位判定（第一人称共现、槽位
    # 优先级、n-gram 窗口）与 converters 的阈值夹取都要有能杀它们的用例。
    "tests/unit/test_query_slot_matching.py",
    "tests/unit/test_query_slot_third_person.py",
    "tests/unit/test_query_slot_contract.py",
    "tests/unit/test_memory_grpc.py",
    "tests/unit/test_rpc_converters_contract.py",
    # 质量打分口径（content_quality）与槽位支持口径（slots/support）：
    # 不选对应用例，这两个模块的变异体会因为「选择集里没有能杀它的用例」
    # 而全部存活 —— 门禁看到的是一片红，实际是用例没被选中。
    "tests/unit/test_content_quality.py",
    # 质量打分的**精确值**契约：方向钉住了不等于阈值钉住了（把「锚点出现
    # 次数上限 4」写成 3，方向没变，但选出来的记忆变了）。不选它，
    # content_quality 的数值型变异体会全部存活。
    "tests/unit/test_content_quality_contract.py",
    "tests/unit/test_write_pre_filter.py",
    # 类型策略的校验与解析（memory_types）：注册表构造、prompt 版本、
    # 属性名抽取、角色准入。
    "tests/unit/test_memory_types.py",
    "tests/unit/test_memory_type_policy.py",
    "tests/unit/test_memory_type_profile.py",
    "tests/unit/test_memory_type_profile_validation.py",
    "tests/unit/test_memory_type_conflict_attribute.py",
    # 过期判定（entities.memory_is_expired）与「这条记忆撑不撑得起来源」。
    "tests/unit/test_temporal_validity.py",
    "tests/unit/test_domain_properties.py",
    # 幂等保证（api/idempotency）：域解析、冲突检测、TTL 清理、LRU 淘汰。
    # 不选它，idempotency 的变异体会因为「选择集里没有能杀它的用例」而存活。
    "tests/unit/test_idempotency.py",
    "tests/unit/test_idempotency_boundary_contract.py",
    # 防捏造闸门的依据词表（slots/support）：每个 marker 都要能独立成为证据。
    # 不选它，那 180 个「某个依据词被改写」的变异体会全部存活。
    "tests/unit/test_source_marker_vocabulary.py",
    # 来源仲裁口径（slots/support）：排序游标、同源判定、来源时间解析、
    # 抽取前的廉价闸门。
    "tests/unit/test_support_module_contract.py",
    # 昵称与沟通偏好的依据词（slots/support）—— 放回变异范围后，
    # 这份用例是那批「依据词被改写」的变异体的唯一杀手，必须被选中。
    "tests/unit/test_source_support_gap_contract.py",
    # 依据词表的**逐条隔离**用例（slots/support）：每个 marker 单独成立，
    # 以及排序游标 / 字节阈值的**精确值**断言。
    "tests/unit/test_support_marker_isolation_contract.py",
    # 服务层调用到 support/entities 判定的那几条路径（写归属、冲突回落、
    # 重建覆盖判定）—— 同上，不选则相关变异体全部存活。
    "tests/unit/test_service_core_decisions.py",
    # 上下文别名表的子串匹配语义（query_slots.context_terms）。
    "tests/unit/test_context_alias_substring_contract.py",
    # 过期判定的唯一口径（entities.memory_is_expired）：召回 / 列表 /
    # 槽位回填三处共用的过期口径，在 entities.py 的变异范围内，必须被选中。
    "tests/unit/test_entities_expiry_contract.py",
    # L2 刷新的去抖 / trailing / 失败语义（memory/l2_refresh.py）：
    # 不选它，去抖阈值与「失败也算已尝试」那几条变异体会全部存活 ——
    # 而那正是 LLM 调用量与摘要新鲜度的两个总开关。
    "tests/unit/test_l2_refresh_decisions_contract.py",
    # drain 静默性：trailing 刷新必须被 drain 等到（回归缺陷的钉子）。
    "tests/unit/test_l2_drain_quiescence.py",
    # L3 队列槽位记账与关停预算（memory/l3.py）：
    # 槽位只进不出 → 队列预算被吃光；drain 提前返回 → 记账没做完。
    "tests/unit/test_l3_executor_contract.py",
    "tests/unit/test_l3_drain_callback.py",
    # 限流的精确值契约（第九轮）：
    # 令牌桶的回填/边界/等待秒数、HTTP 面的 429 与头字段、
    # gRPC 面的调用方标识与对端地址、多副本前置的判定与拒绝。
    "tests/unit/test_token_bucket_contract.py",
    "tests/unit/test_rate_limit_contract.py",
    "tests/unit/test_grpc_rate_limit_contract.py",
    "tests/unit/test_replica_guard_contract.py",
    # 槽位抽取与内容质量的精确值契约（第十轮）：
    # 抽取器的闸门（宠物名 / 作品名 / 标记）、英文模式的大小写、
    # 末次匹配与切分；质量维度的扣分项叠加。
    "tests/unit/test_slot_extractors_contract.py",
    # 词表的 golden 用例（第十一轮重构后新增）：每条措辞配一个样例，
    # 钉住「模式仍命中」+「抽取输出不变」。词表本身已移出变异范围，
    # 这份用例就是它的替代守卫 —— 不选它，词表内容的回归就没人拦。
    "tests/unit/test_slot_vocabulary_golden.py",
]

[tool.hatch.build.targets.wheel.force-include]
"src/thinkback/py.typed" = "thinkback/py.typed"
