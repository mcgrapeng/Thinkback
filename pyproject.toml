[project]
name = "thinkback"
version = "0.1.0"
description = "Memory service for conversations (Thinkback)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.135.2,<0.136",
    "uvicorn[standard]>=0.43.0,<0.44",
    "pydantic>=2.12.5,<3",
    "pydantic-settings>=2.13.1,<3",
    "sqlalchemy[asyncio]>=2.0.49,<3",
    "asyncpg>=0.30.0,<0.31",
    "greenlet>=3.5.0,<4",
    "alembic>=1.18.4,<2",
    "loguru>=0.7.2,<0.8",
    "openai>=2.12.0,<3",
    "python-dotenv>=1.0.0,<2",
    "mem0ai>=2.0.20,<3",
    "pymilvus>=3.0.0,<4",
    "grpcio>=1.60,<2.0",
    "grpcio-reflection>=1.60,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24.0,<0.25",
    "pytest-mock>=3.14.0,<4",
    "pytest-cov>=6.0,<7",
    "httpx>=0.28.0,<0.29",
    "ruff>=0.9,<1.0",
    "mypy>=1.14.0,<2",
    "grpcio-tools>=1.60,<2.0",
    "aiosqlite>=0.22.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thinkback"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ASYNC", "ARG", "SIM"]
ignore = ["E501", "B008", "B904", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# 测试允许未使用的 fixture 参数与裸断言。
"tests/**/*" = ["ARG", "S101"]
"src/thinkback/rpc/memory_pb2.py" = ["ALL"]
"src/thinkback/rpc/memory_pb2.pyi" = ["ALL"]
"src/thinkback/rpc/memory_pb2_grpc.py" = ["ALL"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["thinkback"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "thinkback.rpc.memory_pb2",
    "thinkback.rpc.memory_pb2_grpc",
]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_functions = ["test"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel.force-include]
"src/thinkback/py.typed" = "thinkback/py.typed"
