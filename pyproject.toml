[tool.poetry]
name = "innies-memory"
version = "0.1.0"
description = "Memory service for innies conversations"
authors = ["innies Contributors"]
readme = "README.md"
packages = [
    {include = "innies_memory", from = "src"}
]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastapi = "^0.135.2"
uvicorn = {extras = ["standard"], version = "^0.43.0"}
pydantic = "^2.12.5"
pydantic-settings = "^2.13.1"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.49"}
asyncpg = "^0.30.0"
greenlet = "^3.5.0"
alembic = "^1.18.4"
loguru = "^0.7.2"
openai = "^2.12.0"
python-dotenv = "^1.0.0"
mem0ai = "^2.0.20"
pymilvus = "^3.0.0"
grpcio = ">=1.60,<2.0"
grpcio-reflection = ">=1.60,<2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-mock = "^3.14.0"
pytest-cov = "^6.0"
httpx = "^0.28.0"
ruff = ">=0.9,<1.0"
mypy = "^1.14.0"
grpcio-tools = ">=1.60,<2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ASYNC", "ARG", "SIM"]
ignore = ["E501", "B008", "B904", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"test/**/*" = ["ARG", "S101"]
"src/innies_memory/rpc/memory_pb2.py" = ["ALL"]
"src/innies_memory/rpc/memory_pb2.pyi" = ["ALL"]
"src/innies_memory/rpc/memory_pb2_grpc.py" = ["ALL"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["innies_memory"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "innies_memory.rpc.memory_pb2",
    "innies_memory.rpc.memory_pb2_grpc",
]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["test"]
pythonpath = ["src"]
asyncio_mode = "auto"
