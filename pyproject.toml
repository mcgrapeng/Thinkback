[project]
name = "thinkback"
version = "0.1.0"
description = "Memory service for conversations (Thinkback)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.135.2,<0.136",
    "uvicorn[standard]>=0.43.0,<0.44",
    "pydantic>=2.12.5,<3",
    "pydantic-settings>=2.13.1,<3",
    "sqlalchemy[asyncio]>=2.0.49,<3",
    "asyncpg>=0.30.0,<0.31",
    "greenlet>=3.5.0,<4",
    "alembic>=1.18.4,<2",
    "loguru>=0.7.2,<0.8",
    "openai>=2.12.0,<3",
    "httpx>=0.28.0,<0.29",
    "python-dotenv>=1.0.0,<2",
    "mem0ai==2.2.1",
    "pymilvus>=3.0.0,<4",
    "grpcio>=1.60,<2.0",
    "grpcio-reflection>=1.60,<2.0",
    "mcp>=1.2,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0",
    "pytest-mock>=3.14.0,<4",
    "pytest-cov>=6.0,<7",
    "ruff>=0.9,<1.0",
    "mypy>=1.14.0,<2",
    "grpcio-tools>=1.60,<2.0",
    "aiosqlite>=0.22.1",
    "mutmut>=3.8.0",
    "hypothesis>=6.168.5",
    # 解析 pytest 的 junit 报告用（用例防回血基线）。stdlib 的 ElementTree
    # 不做实体展开防护，用 defusedxml 免掉 XXE / billion laughs。
    "defusedxml>=0.7.1",
    "pytest-testmon>=2.2.0",
    "pip-audit>=2.10.1",
    # e2e 驱动：声明为 dev 依赖，`make test-e2e` 才在干净环境可跑。
    "playwright>=1.49.0",
    "schemathesis>=4.30.1",
]

[project.scripts]
thinkback-mcp = "thinkback.mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thinkback"]

[tool.ruff]
line-length = 100
target-version = "py312"
# mutmut 生成的变异树（make mutation-audit 产物）不参与格式/静态检查
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ASYNC", "ARG", "SIM"]
ignore = ["E501", "B008", "B904", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# 测试允许未使用的 fixture 参数与裸断言。
"tests/**/*" = ["ARG", "S101"]
"src/thinkback/rpc/memory_pb2.py" = ["ALL"]
"src/thinkback/rpc/memory_pb2.pyi" = ["ALL"]
"src/thinkback/rpc/memory_pb2_grpc.py" = ["ALL"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["thinkback"]
ignore_missing_imports = true
exclude = "^mutants/"

[[tool.mypy.overrides]]
module = [
    "thinkback.rpc.memory_pb2",
    "thinkback.rpc.memory_pb2_grpc",
]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
# 默认套件只含确定性用例；tests/e2e 由 make test-e2e 显式运行（要起前端）。
testpaths = ["tests/unit"]
python_functions = ["test"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.coverage.run]
# protoc 生成代码不计入覆盖率（其正确性由编译器与测试间接保证）
omit = [
    "src/thinkback/rpc/memory_pb2.py",
    "src/thinkback/rpc/memory_pb2_grpc.py",
]

[tool.mutmut]
# 变异测试审计范围：小而纯的逻辑模块。source_paths 必须整棵 src
# （mutants 树要能 import 完整包），用 only_mutate 收窄变异目标；
# service.py（6000+ 行）全量变异留给 CI 夜间任务。
#
# 收窄标准：**纯函数 + 有判定分支**。这类模块的变异体才代表真实缺陷
# （比较方向翻转、阈值差一、份额写反）；胶水代码的变异体只会是
# 「日志文案变了」这种噪音，登记成存活只会稀释门禁的信噪比。
#
# recall_policy 是记忆系统里逻辑最密的一块（去重 / 槽位仲裁 / 预算分配 /
# 逐层裁剪），此前**一个变异体都没有** —— 第四轮审计把它列成了缺口。
source_paths = ["src"]
# mutmut 的超时 = (估算用时 + 1) × timeout_multiplier。估算值来自空载机器上的
# 单次测试耗时，而实际是 8 个 worker 并行跑 —— 墙钟时间会膨胀 3~5 倍。
# 倍数太小会出现**假超时**：明明跑完了、被判成 timeout，白白算成「没杀掉」。
# 60 倍给并行留够余量（单个体约 12~30 秒）。
timeout_multiplier = 60
only_mutate = [
    "src/thinkback/domain/keys.py",
    "src/thinkback/domain/summarization.py",
    "src/thinkback/domain/recall_policy.py",
    "src/thinkback/domain/dedup.py",
    "src/thinkback/domain/classification.py",
    "src/thinkback/domain/safety.py",
    "src/thinkback/memory/decay.py",
    "src/thinkback/memory/task_state.py",
    "src/thinkback/memory/retention.py",
    "src/thinkback/memory/repositories/_l1_cache.py",
    "src/thinkback/infra/structured_logging.py",
]
pytest_add_cli_args_test_selection = [
    "tests/unit/test_memory_decay.py",
    "tests/unit/test_memory_repositories.py",
    "tests/unit/test_repository_contract.py",
    "tests/unit/test_domain_pure_functions.py",
    "tests/unit/test_l2_llm_summary.py",
    "tests/unit/test_recall_policy.py",
    "tests/unit/test_recall_policy_properties.py",
    "tests/unit/test_recall_policy_edge_cases.py",
    "tests/unit/test_recall_policy_contract.py",
    # 类型级 token 上限（type_caps）只在这里被断言 —— 不选它，
    # recall_policy 里 metadata/memory_type 那条分支的变异体全部存活。
    "tests/unit/test_memory_recall_budget.py",
    "tests/unit/test_memory_lifecycle_properties.py",
    "tests/unit/test_memory_retention.py",
    "tests/unit/test_retention_cleanup_contract.py",
    "tests/unit/test_retention_contract.py",
    "tests/unit/test_task_state.py",
    "tests/unit/test_safety_gate_patterns.py",
    "tests/unit/test_safety_gate_policy.py",
    "tests/unit/test_safety_gate_contract.py",
    "tests/unit/test_classification_policy.py",
    "tests/unit/test_classification_contract.py",
    "tests/unit/test_structured_logging.py",
    "tests/unit/test_structured_logging_contract.py",
    "tests/unit/test_domain_dedup.py",
]

[tool.hatch.build.targets.wheel.force-include]
"src/thinkback/py.typed" = "thinkback/py.typed"
