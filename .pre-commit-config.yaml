fail_fast: false
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit, manual]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-toml
      - id: check-yaml
        args: ['--unsafe']
      - id: check-json
      - id: debug-statements
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        description: Lint Python sources with Ruff.
        entry: poetry run ruff check src test script alembic
        language: system
        files: \.py$
        pass_filenames: false
      - id: ruff-format
        name: ruff format --check
        description: Check Python formatting with Ruff (no auto-fix).
        entry: poetry run ruff format --check src test script alembic
        language: system
        files: \.py$
        pass_filenames: false
      - id: mypy
        name: mypy
        description: Static type-check Python sources under src/.
        entry: poetry run mypy src
        language: system
        files: ^src/.*\.py$
        pass_filenames: false
