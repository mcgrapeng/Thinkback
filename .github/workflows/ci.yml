name: Quality Gates

on:
  push:
    branches:
      - "main"
      - "dev"
      - "tests"
  pull_request:
    branches:
      - "main"
      - "dev"
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  lint-and-typecheck:
    name: ruff + mypy strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: mypy strict
        run: uv run mypy --strict src

  unit-tests:
    name: pytest (no real deps)
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Unit tests
        # tests/unit 全是确定性用例：不触真实 PG / Milvus / LLM，不需要任何凭证。
        run: uv run pytest tests/unit/ -q --junitxml=/tmp/pytest-junit.xml
      - name: Test baseline (no deletions, no skipped pins)
        # 删用例或把它 skip 掉都必须显式更新基线 —— 门禁因此不会静默失效。
        # 复用上一步那次跑的 junit 报告，不重复跑一遍套件。
        run: >-
          uv run --group dev python tests/eval/check_pytest_baseline.py
          --junit /tmp/pytest-junit.xml

  supply-chain-audit:
    name: pip-audit (CVE gate)
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --frozen
      - name: Audit dependencies
        run: uv run --group dev pip-audit

  api-fuzz:
    name: schemathesis (contract fuzz)
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --frozen
      - name: Contract fuzz
        run: uv run --group dev pytest tests/fuzz -q --junitxml=/tmp/pytest-junit.xml
      - name: Test baseline (no deletions, no skipped pins)
        run: >-
          uv run --group dev python tests/eval/check_pytest_baseline.py
          --suite tests/fuzz --junit /tmp/pytest-junit.xml

  docker-build-verify:
    name: docker build (verify)
    needs: [lint-and-typecheck, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build docker image (no push)
        run: docker build -t thinkback:ci-${{ github.sha }} .

  mutation-and-eval:
    name: mutation audit + self-contained evaluation
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Mutation scope self-heal
        # mutmut 按 mutants/ 里副本的 mtime 判断「这份文件已有变异体」——
        # 范围变了但留着旧副本时，新增文件一个变异体都不生成，门禁照样绿。
        # 这一步按范围指纹精确清掉遮蔽物，PR 门禁也要有它，不能只在本地/夜间跑。
        run: uv run --group dev python tests/eval/refresh_mutation_stats.py
      - name: Mutation audit (no new survivors allowed)
        run: uv run --group dev mutmut run --max-children 8
      - name: Mutation survivor baseline
        run: uv run --group dev python tests/eval/check_mutation_survivors.py
      - name: Self-contained evaluation + baseline
        run: uv run --group dev python tests/script/run_self_contained_evaluation.py
      - name: Evaluation baseline
        run: uv run --group dev python tests/script/eval/check_baseline.py
      - name: Vertical evaluation + baseline
        run: uv run --group dev python tests/script/eval/run_semiconductor_evaluation.py
      - name: Vertical evaluation baseline
        run: uv run --group dev python tests/script/eval/check_baseline.py --report-dir docs/memory/report/semiconductor --baseline tests/eval/baseline_semiconductor.json

  web-gates:
    name: admin console (build + unit + e2e + audit)
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: npm audit (high severity blocks)
        working-directory: web
        run: npm audit --audit-level=high
      - name: Frontend unit tests
        working-directory: web
        run: npm run test-ui
      - name: Frontend production build
        working-directory: web
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --frozen
      - name: Install playwright browsers
        run: uv run --group dev playwright install --with-deps chromium
      - name: End-to-end smoke
        run: uv run --group dev pytest tests/e2e -v --junitxml=/tmp/pytest-junit.xml
      - name: Test baseline (no deletions, no skipped pins)
        run: >-
          uv run --group dev python tests/eval/check_pytest_baseline.py
          --suite tests/e2e --junit /tmp/pytest-junit.xml

  nightly-full:
    name: nightly (full local gates + real-stack scripts)
    needs: [lint-and-typecheck, unit-tests, mutation-and-eval, web-gates]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --frozen
      - name: Full local gate
        run: make check
      - name: Contract fuzz
        run: uv run --group dev pytest tests/fuzz -q

  real-stack-gate:
    name: real-stack gate (Milvus + PG + live LLM)
    needs: lint-and-typecheck
    # 只在夜间与手动触发时跑：它要真实 Milvus + PG + 可达的 LLM/embedding
    # endpoint，还要分钟级时间 —— 不适合当 PR 门禁。
    #
    # 为什么进 CI：决策 D25 当初写「不进 CI」，是因为门禁那时还不存在。现在
    # 它存在，而且抓到过自包含评测永远看不见的缺陷 —— L1 缓存关掉时召回整层
    # 消失，而 degraded 标志仍然是 False，没有任何报错。只在本地跑 = 只有跑
    # 门禁的那个人受益。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thinkback
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --frozen
      - name: Check credentials
        id: creds
        # 凭据经 env 传进脚本，不直接拼进 run: —— 避免把 secret 值当代码。
        env:
          LLM_BASE_URL: ${{ secrets.MEMORY_LLM_BASE_URL }}
          LLM_KEY: ${{ secrets.MEMORY_LLM_KEY }}
        # 没配凭据就跳过，而不是红着：仓库没有 LLM 凭据时，每晚一条红 job
        # 只会让人学会忽略它 —— 那比没有门禁更糟。
        run: |
          if [ -z "$LLM_BASE_URL" ] || [ -z "$LLM_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 LLM 凭据，跳过真实栈门禁"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Start Milvus
        if: steps.creds.outputs.available == 'true'
        run: docker compose -f deploy/milvus-local/docker-compose.yml up -d
      - name: Wait for Milvus
        if: steps.creds.outputs.available == 'true'
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:19540/healthz > /dev/null; then
              echo "milvus ready"; exit 0
            fi
            sleep 5
          done
          echo "::error::Milvus 5 分钟内没就绪"
          docker compose -f deploy/milvus-local/docker-compose.yml logs
          exit 1
      - name: Write credentials file
        if: steps.creds.outputs.available == 'true'
        # 凭据只落在这台 runner 上，不进版本库（.env 在 .gitignore 里）。
        # secret 经 env 传进来，不拼进命令文本；含换行的值直接拒绝 ——
        # 否则一行能塞进两条 .env 变量。
        #
        # **模型名也要写进去**：产品默认值是「qwen-plus-latest」/
        # 「default-embedding」（公有云端点），而这里的端点是自建的 vLLM ——
        # 不写模型名就用默认值去请求，端点上没有这个模型（实测 404
        # `The model qwen-plus-latest does not exist`），抽取全空，
        # 门禁会以「召回 0 条」的形式红掉，而根因是配置而不是记忆系统。
        env:
          LLM_BASE_URL: ${{ secrets.MEMORY_LLM_BASE_URL }}
          LLM_KEY: ${{ secrets.MEMORY_LLM_KEY }}
          LLM_MODEL: ${{ vars.MEMORY_LLM_MODEL }}
          EMBEDDING_BASE_URL: ${{ secrets.MEMORY_EMBEDDING_BASE_URL }}
          EMBEDDING_API_KEY: ${{ secrets.MEMORY_EMBEDDING_API_KEY }}
          EMBEDDING_MODEL: ${{ vars.MEMORY_EMBEDDING_MODEL }}
          EMBEDDING_DIMS: ${{ vars.MEMORY_EMBEDDING_DIMS || '1024' }}
        run: |
          for name in LLM_BASE_URL LLM_KEY EMBEDDING_BASE_URL EMBEDDING_API_KEY; do
            value="${!name}"
            if [[ "$value" == *$'\n'* ]]; then
              echo "::error::$name 含换行，拒绝写入 .env"
              exit 1
            fi
          done
          {
            echo "ENVIRONMENT=production"
            echo "DATABASE_URL=postgres://postgres:postgres@localhost:5432/thinkback"
            echo "MILVUS_URL=http://localhost:19540"
            echo "MILVUS_DATABASE=default"
            echo "MEMORY_LLM_BASE_URL=${LLM_BASE_URL}"
            echo "MEMORY_LLM_KEY=${LLM_KEY}"
            echo "MEMORY_EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL}"
            echo "MEMORY_EMBEDDING_API_KEY=${EMBEDDING_API_KEY}"
            echo "MEMORY_EMBEDDING_DIMS=${EMBEDDING_DIMS}"
            # 模型名留空时用产品默认值；端点上有别的模型名就靠这两个变量指定。
            [ -n "${LLM_MODEL}" ] && echo "MEMORY_LLM_MODEL=${LLM_MODEL}"
            [ -n "${EMBEDDING_MODEL}" ] && echo "MEMORY_EMBEDDING_MODEL=${EMBEDDING_MODEL}"
            true
          } > .env
      - name: Verify the configured models exist on the endpoint
        if: steps.creds.outputs.available == 'true'
        # 模型名写错 = 端点上没有这个模型 = 抽取全空 = 门禁红。
        # 但那个红看起来像「记忆系统坏了」，根因却是配置。
        # 这里提前验一次，把「配置错了」与「记忆系统坏了」分开。
        env:
          LLM_BASE_URL: ${{ secrets.MEMORY_LLM_BASE_URL }}
          LLM_KEY: ${{ secrets.MEMORY_LLM_KEY }}
          EMBEDDING_BASE_URL: ${{ secrets.MEMORY_EMBEDDING_BASE_URL }}
          EMBEDDING_API_KEY: ${{ secrets.MEMORY_EMBEDDING_API_KEY }}
        run: |
          set -euo pipefail
          # 从写好的 .env 里读实际生效的模型名（含产品默认值）。
          llm_model=$(grep -E '^MEMORY_LLM_MODEL=' .env | cut -d= -f2- || true)
          emb_model=$(grep -E '^MEMORY_EMBEDDING_MODEL=' .env | cut -d= -f2- || true)
          llm_model=${llm_model:-qwen-plus-latest}
          emb_model=${emb_model:-default-embedding}
          check() {
            local base=$1 key=$2 model=$3 label=$4
            local available
            available=$(curl -sf -H "Authorization: Bearer ${key}" "${base%/}/models" \
              | python3 -c "import json,sys;print(' '.join(d.get('id','') for d in json.load(sys.stdin).get('data',[])))" \
              || echo "")
            if ! echo " ${available} " | grep -q " ${model} "; then
              echo "::error::${label} 端点上没有模型 '${model}'（可用：${available:-无}）—— 配置错了，不是记忆系统坏了"
              exit 1
            fi
            echo "${label} 模型 '${model}' 可用"
          }
          check "$LLM_BASE_URL" "$LLM_KEY" "$llm_model" "LLM"
          check "$EMBEDDING_BASE_URL" "$EMBEDDING_API_KEY" "$emb_model" "Embedding"
      - name: Real-stack gate
        if: steps.creds.outputs.available == 'true'
        run: make gate-real
      - name: Vertical evaluation (real stack)
        if: steps.creds.outputs.available == 'true'
        # 垂类评测的**真实模式**：真实 PG + Milvus + Mem0 + LLM。
        #
        # 为什么它必须在 CI 里（第十五轮教训）：垂类语料在 2026-10-28 写完，
        # 2026-10-29 产品改成「按类型带抽取指令」，语料没跟着改 —— 真实栈
        # 通过率从 40/40 退化到 22.5%，**潜伏 6 天无人察觉**。原因有二：
        # 自包含模式 100% 通过（假后端不抽取，掩盖了问题），而 --real 模式
        # 不在任何 CI job 里 —— 没有门禁会红。
        #
        # 地板在 tests/eval/baseline_semiconductor_real.json（按真实基线取，
        # 留抖动余量）。泄漏与机制违规仍然卡 0：那是正确性问题，不是质量问题。
        run: |
          uv run --group dev python tests/script/eval/run_semiconductor_evaluation.py --real
          uv run --group dev python tests/script/eval/check_baseline.py \
            --report-dir docs/memory/report/semiconductor \
            --baseline tests/eval/baseline_semiconductor_real.json
      - name: Upload gate report
        if: steps.creds.outputs.available == 'true' && always()
        # 报告目录在 .gitignore 里 —— 归档走 artifact，不进版本库。
        uses: actions/upload-artifact@v4
        with:
          name: real-stack-gate-report
          path: |
            docs/memory/report/real/
            docs/memory/report/semiconductor/
          if-no-files-found: ignore

