name: Quality Gates

on:
  push:
    branches:
      - "main"
      - "dev"
      - "tests"
  pull_request:
    branches:
      - "main"
      - "dev"
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    name: ruff + mypy strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: mypy strict
        run: uv run mypy --strict src

  unit-tests:
    name: pytest (no real deps)
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Unit tests
        # 显式跳过"需要真实依赖"的脚本级用例，避免无凭证暴露缺 infra 红灯
        run: uv run pytest tests/unit/ --ignore=tests/unit/test_real_quality_evaluation.py --ignore=tests/unit/test_runtime_boundaries.py -q

  docker-build-verify:
    name: docker build (verify)
    needs: [lint-and-typecheck, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build docker image (no push)
        run: docker build -t thinkback:ci-${{ github.sha }} .