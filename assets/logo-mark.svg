<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Thinkback">
  <title>Thinkback</title>
  <desc>Thinkback mark — three memory layers: round journal, session summary, long-term memory. The outer arc represents recall across time.</desc>
  <defs>
    <linearGradient id="tb-core" x1="40" y1="40" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="tb-mid" x1="32" y1="32" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="tb-out" x1="24" y1="24" x2="104" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="tb-violet" x1="40" y1="88" x2="88" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <!-- Outer ring (L3 long-term) -->
  <circle cx="64" cy="64" r="58" fill="none"
          stroke="url(#tb-out)" stroke-width="3" opacity="0.7"/>
  <circle cx="64" cy="64" r="58" fill="none"
          stroke="url(#tb-out)" stroke-width="1" stroke-dasharray="2 4" opacity="0.4"
          transform="rotate(45 64 64)"/>

  <!-- Middle ring (L2 summary) -->
  <circle cx="64" cy="64" r="42" fill="none"
          stroke="url(#tb-mid)" stroke-width="2.5" opacity="0.85"/>

  <!-- Core (L1 journal) -->
  <circle cx="64" cy="64" r="26" fill="url(#tb-core)"/>

  <!-- Recall echo: arrow from inside to outside -->
  <path d="M 58 54 L 76 64 L 58 74" fill="none" stroke="#F8FAFC"
        stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Violet accent dot (the present moment) -->
  <circle cx="64" cy="64" r="4" fill="url(#tb-violet)"/>
  <circle cx="64" cy="64" r="2" fill="#F8FAFC"/>
</svg>
