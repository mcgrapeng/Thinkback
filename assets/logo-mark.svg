<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Thinkback">
  <title>Thinkback</title>
  <desc>Thinkback mark — three-node memory network: two source nodes connecting down to a violet center node, with the center node ringed in white to mark the present moment.</desc>
  <defs>
    <linearGradient id="tb-violet" x1="40" y1="88" x2="88" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <!-- Two source nodes (top) — L1/L2 storage -->
  <circle cx="36" cy="36" r="11" fill="#0F172A"/>
  <circle cx="92" cy="36" r="11" fill="#0F172A"/>

  <!-- Violet center node (bottom) — L3 long-term + the "present" -->
  <circle cx="64" cy="92" r="14" fill="url(#tb-violet)"/>
  <!-- White inner ring on violet — marks the focal point -->
  <circle cx="64" cy="92" r="6.5" fill="none" stroke="#F8FAFC" stroke-width="2.2"/>
  <!-- Violet dot at the very center — the "present moment" -->
  <circle cx="64" cy="92" r="3" fill="url(#tb-violet)"/>

  <!-- Three connection lines, two violet (to center) + one subtle between tops -->
  <line x1="36" y1="36" x2="64" y2="92" stroke="#7C3AED" stroke-width="5"
        stroke-linecap="round" opacity="0.85"/>
  <line x1="92" y1="36" x2="64" y2="92" stroke="#7C3AED" stroke-width="5"
        stroke-linecap="round" opacity="0.85"/>
  <line x1="36" y1="36" x2="92" y2="36" stroke="#64748B" stroke-width="3.5"
        stroke-linecap="round" opacity="0.55"/>
</svg>
