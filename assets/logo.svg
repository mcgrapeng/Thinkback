<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 128" role="img" aria-label="Thinkback">
  <title>Thinkback</title>
  <defs>
    <linearGradient id="tb-lockup" x1="14" y1="22" x2="108" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <!-- mark: recall echo -->
  <g transform="translate(-5,0)">
    <path d="M 97 30 L 59 64 L 97 98" fill="none" stroke="url(#tb-lockup)" stroke-width="15"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 71 40 L 43 64 L 71 88" fill="none" stroke="url(#tb-lockup)" stroke-width="13"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
    <path d="M 48 50 L 28 64 L 48 78" fill="none" stroke="url(#tb-lockup)" stroke-width="11"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.32"/>
  </g>

  <!-- wordmark -->
  <text x="132" y="82"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="62" font-weight="800" letter-spacing="-2.2" fill="#0B1220">Thinkback</text>
</svg>
