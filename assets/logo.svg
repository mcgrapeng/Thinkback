<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" role="img" aria-label="Thinkback">
  <title>Thinkback</title>
  <defs>
    <linearGradient id="tb-wm-violet" x1="22" y1="66" x2="42" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <!-- 3-node network mark, scaled down to fit -->
  <g transform="translate(8, 8) scale(0.5)">
    <!-- Two source nodes -->
    <circle cx="36" cy="36" r="11" fill="#0F172A"/>
    <circle cx="92" cy="36" r="11" fill="#0F172A"/>
    <!-- Violet center node -->
    <circle cx="64" cy="92" r="14" fill="url(#tb-wm-violet)"/>
    <circle cx="64" cy="92" r="6.5" fill="none" stroke="#F8FAFC" stroke-width="2.2"/>
    <circle cx="64" cy="92" r="3" fill="url(#tb-wm-violet)"/>
    <!-- Connection lines -->
    <line x1="36" y1="36" x2="64" y2="92" stroke="#7C3AED" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
    <line x1="92" y1="36" x2="64" y2="92" stroke="#7C3AED" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
    <line x1="36" y1="36" x2="92" y2="36" stroke="#64748B" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- Wordmark -->
  <text x="92" y="52" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="28" font-weight="700" fill="#0F172A" letter-spacing="-0.5">
    Thinkback
  </text>
  <text x="92" y="68" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="10" font-weight="500" fill="#64748B" letter-spacing="0.8">
    MEMORY LAYER FOR AI
  </text>
</svg>
