<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" role="img" aria-label="thinkback — Memory Layer for Personalized AI Conversations">
  <defs>
    <linearGradient id="tb-bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="tb-wash" x1="0" y1="0" x2="920" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <rect width="920" height="220" fill="url(#tb-wash)"/>

  <g transform="translate(50,30)">
    <rect x="10" y="10" width="140" height="140" rx="28" ry="28" fill="none" stroke="url(#tb-bg)" stroke-width="6" opacity="0.35"/>
    <rect x="36" y="36" width="88" height="88" rx="18" ry="18" fill="none" stroke="url(#tb-bg)" stroke-width="9" opacity="0.7"/>
    <rect x="64" y="64" width="32" height="32" rx="8" ry="8" fill="url(#tb-bg)"/>
  </g>

  <text x="240" y="115"
        font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="60" font-weight="800" fill="#0a0a0a" letter-spacing="-2">thinkback</text>
  <text x="242" y="155"
        font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="18" font-weight="600" fill="#374151">Memory Layer for Personalized AI Conversations</text>
  <text x="242" y="180"
        font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="13" font-weight="400" fill="#9ca3af">三层记忆 · PostgreSQL · Milvus · Mem0</text>
</svg>