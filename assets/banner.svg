<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img"
     aria-label="Thinkback — Memory Layer for Personalized AI Conversations">
  <title>Thinkback</title>
  <defs>
    <!-- Warm paper background -->
    <linearGradient id="tb-bg" x1="0" y1="0" x2="1200" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDFCF8"/>
      <stop offset="60%" stop-color="#F8F6F0"/>
      <stop offset="100%" stop-color="#F5F2EC"/>
    </linearGradient>

    <!-- Subtle warm vignette -->
    <radialGradient id="tb-vignette" cx="600" cy="240" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.04"/>
    </radialGradient>

    <!-- Logo color rings -->
    <linearGradient id="tb-ring-outer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="tb-ring-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="tb-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="tb-violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <!-- Subtle data flow line gradient -->
    <linearGradient id="tb-flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#tb-bg)"/>
  <rect width="1200" height="480" fill="url(#tb-vignette)"/>

  <!-- Subtle horizontal rule at top -->
  <line x1="80" y1="40" x2="1120" y2="40" stroke="#E8E2D4" stroke-width="1"/>

  <!-- Left side: Logo + Wordmark + Tagline -->
  <g transform="translate(80, 110)">
    <!-- Logo mark: 3-layer memory circle with recall arrow -->
    <g transform="translate(0, 0)">
      <!-- Outer ring L3 -->
      <circle cx="65" cy="65" r="60" fill="none" stroke="url(#tb-ring-outer)" stroke-width="3" opacity="0.7"/>
      <circle cx="65" cy="65" r="60" fill="none" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="2 4" opacity="0.4"/>
      <!-- Mid ring L2 -->
      <circle cx="65" cy="65" r="44" fill="none" stroke="url(#tb-ring-mid)" stroke-width="2.5" opacity="0.85"/>
      <!-- Core L1 -->
      <circle cx="65" cy="65" r="27" fill="url(#tb-core)"/>
      <!-- Recall arrow -->
      <path d="M 58 55 L 78 65 L 58 75" fill="none" stroke="#F8FAFC" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Violet present dot -->
      <circle cx="65" cy="65" r="4.5" fill="url(#tb-violet)"/>
      <circle cx="65" cy="65" r="2" fill="#F8FAFC"/>
    </g>

    <!-- Wordmark -->
    <text x="160" y="55" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="58" font-weight="700" fill="#0F172A" letter-spacing="-1.5">
      Thinkback
    </text>
    <text x="162" y="80" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="14" font-weight="500" fill="#64748B" letter-spacing="2.5">
      MEMORY LAYER FOR PERSONALIZED AI
    </text>
  </g>

  <!-- Right side: Three-layer memory model visualization -->
  <g transform="translate(820, 110)">
    <!-- L3 outer ring -->
    <circle cx="100" cy="130" r="100" fill="none"
            stroke="url(#tb-ring-outer)" stroke-width="2" opacity="0.4"/>
    <text x="100" y="32" font-family="system-ui, -apple-system, sans-serif"
          font-size="10" font-weight="500" fill="#94A3B8" letter-spacing="2"
          text-anchor="middle">L3 · LONG-TERM</text>

    <!-- L2 middle ring -->
    <circle cx="100" cy="130" r="70" fill="none"
            stroke="url(#tb-ring-mid)" stroke-width="2" opacity="0.6"/>
    <text x="100" y="60" font-family="system-ui, -apple-system, sans-serif"
          font-size="9" font-weight="500" fill="#64748B" letter-spacing="1.5"
          text-anchor="middle">L2 · SUMMARY</text>

    <!-- L1 core -->
    <circle cx="100" cy="130" r="40" fill="url(#tb-core)" opacity="0.95"/>
    <text x="100" y="100" font-family="system-ui, -apple-system, sans-serif"
          font-size="9" font-weight="600" fill="#F8FAFC" letter-spacing="1.5"
          text-anchor="middle">L1 · ROUND</text>

    <!-- Recall arrow inside core -->
    <path d="M 90 122 L 115 130 L 90 138" fill="none" stroke="#F8FAFC" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Violet accent: present moment pulse -->
    <circle cx="100" cy="130" r="5" fill="url(#tb-violet)">
      <animate attributeName="r" values="4.5;6;4.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="130" r="2" fill="#F8FAFC"/>

    <!-- Data flow indicators (subtle) -->
    <line x1="60" y1="160" x2="140" y2="160" stroke="url(#tb-flow)" stroke-width="1.5" opacity="0.6"/>
    <circle cx="100" cy="160" r="1.5" fill="#7C3AED" opacity="0.7">
      <animate attributeName="cx" values="60;140;60" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Bottom subtitle -->
  <g transform="translate(80, 280)">
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="20" font-weight="500" fill="#1E293B">
      Self-hosted memory service for AI conversations
    </text>
    <text x="0" y="28" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="14" font-weight="400" fill="#64748B">
      Three explicit layers · HTTP + gRPC · Idempotent writes · Production-grade governance
    </text>
  </g>

  <!-- Bottom CTA badges row -->
  <g transform="translate(80, 360)">
    <!-- Quick start pill -->
    <g>
      <rect x="0" y="0" width="170" height="36" rx="18" fill="#0F172A"/>
      <text x="85" y="23" font-family="system-ui, -apple-system, sans-serif"
            font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">
        Quick start →
      </text>
    </g>
    <!-- Docs pill -->
    <g transform="translate(186, 0)">
      <rect x="0" y="0" width="140" height="36" rx="18" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="70" y="23" font-family="system-ui, -apple-system, sans-serif"
            font-size="13" font-weight="500" fill="#1E293B" text-anchor="middle">
        Documentation
      </text>
    </g>
    <!-- GitHub star pill -->
    <g transform="translate(342, 0)">
      <rect x="0" y="0" width="170" height="36" rx="18" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
      <path d="M 16 18 L 12 14 L 16 10 M 12 14 L 8 14" stroke="#1E293B" stroke-width="1.5"
            fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(0, 4)"/>
      <text x="100" y="23" font-family="system-ui, -apple-system, sans-serif"
            font-size="13" font-weight="500" fill="#1E293B" text-anchor="middle">
        Star on GitHub
      </text>
    </g>
  </g>

  <!-- Bottom horizontal rule -->
  <line x1="80" y1="440" x2="1120" y2="440" stroke="#E8E2D4" stroke-width="1"/>

  <!-- Tiny meta line at the very bottom -->
  <text x="80" y="462" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="11" font-weight="500" fill="#94A3B8" letter-spacing="0.3">
    Apache 2.0 · Mem0 + Milvus + PostgreSQL · gRPC + HTTP/JSON
  </text>
  <text x="1120" y="462" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="11" font-weight="500" fill="#94A3B8" letter-spacing="0.3" text-anchor="end">
    v1.0 · stable
  </text>
</svg>
