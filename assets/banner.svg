<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" role="img"
     aria-label="Thinkback — Memory Layer for Personalized AI Conversations">
  <title>Thinkback</title>
  <defs>
    <linearGradient id="tb-bm" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="tb-wash" x1="0" y1="0" x2="920" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EEF2FF" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#ECFEFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tb-accent" x1="250" y1="70" x2="470" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="tb-glow" cx="130" cy="120" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="920" height="240" fill="url(#tb-wash)"/>
  <rect width="920" height="240" fill="url(#tb-glow)"/>

  <!-- mark -->
  <g transform="translate(48,36) scale(1.32)">
    <g transform="translate(-5,0)">
      <path d="M 97 30 L 59 64 L 97 98" fill="none" stroke="url(#tb-bm)" stroke-width="15"
            stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 71 40 L 43 64 L 71 88" fill="none" stroke="url(#tb-bm)" stroke-width="13"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
      <path d="M 48 50 L 28 64 L 48 78" fill="none" stroke="url(#tb-bm)" stroke-width="11"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.32"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="248" y="116"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="68" font-weight="800" letter-spacing="-2.5" fill="#0B1220">Thinkback</text>

  <!-- rule -->
  <rect x="250" y="138" width="92" height="4" rx="2" fill="url(#tb-accent)"/>

  <!-- taglines -->
  <text x="248" y="176"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="19" font-weight="600" fill="#334155">Memory Layer for Personalized AI Conversations</text>
  <text x="248" y="204"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="14" font-weight="400" fill="#64748B">三层记忆架构 · PostgreSQL · Milvus · Mem0 · HTTP + gRPC</text>
</svg>
