<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" role="img" aria-label="thinkback — Memory Layer for Conversation Assistants">
  <defs>
    <linearGradient id="tb-bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="tb-bg-soft" x1="0" y1="0" x2="880" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <!-- soft background wash -->
  <rect width="880" height="220" fill="url(#tb-bg-soft)"/>

  <!-- logo: 3 concentric circles, scaled to 160×160 -->
  <g transform="translate(40,30)">
    <circle cx="80" cy="80" r="64" fill="none" stroke="url(#tb-bg)" stroke-width="5" opacity="0.35"/>
    <circle cx="80" cy="80" r="42" fill="none" stroke="url(#tb-bg)" stroke-width="8" opacity="0.7"/>
    <circle cx="80" cy="80" r="18" fill="url(#tb-bg)"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="240" y="115"
        font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="56" font-weight="800" fill="#0a0a0a" letter-spacing="-1.5">thinkback</text>
  <text x="242" y="155"
        font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="18" font-weight="500" fill="#6b7280">Memory Layer for Conversation Assistants</text>
  <text x="242" y="180"
        font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="13" font-weight="400" fill="#9ca3af">三层记忆 · PostgreSQL + Milvus + Mem0</text>
</svg>