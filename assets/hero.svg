<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420"
     role="img" aria-label="Thinkback — Self-hosted memory service for AI conversations">
  <title>Thinkback — Self-hosted memory service for AI conversations</title>
  <desc>Dark cinematic hero: the Thinkback three-node memory mark glowing above the wordmark, over a deep violet-black gradient with aurora light and a faint grid.</desc>

  <defs>
    <!-- Deep background gradient -->
    <linearGradient id="h-bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#08070F"/>
      <stop offset="45%"  stop-color="#140E2E"/>
      <stop offset="100%" stop-color="#0B0A16"/>
    </linearGradient>

    <!-- Aurora bloom, upper-left -->
    <radialGradient id="h-aurora-a" cx="180" cy="90" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#7C3AED" stop-opacity="0.42"/>
      <stop offset="55%"  stop-color="#7C3AED" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <!-- Aurora bloom, right -->
    <radialGradient id="h-aurora-b" cx="1010" cy="330" r="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#C026D3" stop-opacity="0.46"/>
      <stop offset="55%"  stop-color="#A78BFA" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>

    <!-- Aurora bloom, center behind the mark -->
    <radialGradient id="h-halo" cx="600" cy="140" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#A78BFA" stop-opacity="0.34"/>
      <stop offset="60%"  stop-color="#8B5CF6" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- Edge vignette to keep text crisp -->
    <radialGradient id="h-vig" cx="600" cy="210" r="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="78%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.38"/>
    </radialGradient>

    <!-- Wordmark gradient -->
    <linearGradient id="h-mark" x1="380" y1="215" x2="820" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#C4B5FD"/>
      <stop offset="50%"  stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <!-- Node gradient -->
    <linearGradient id="h-node" x1="548" y1="52" x2="652" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Bottom fade rule -->
    <linearGradient id="h-edge" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#C026D3" stop-opacity="0.95"/>
      <stop offset="82%"  stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>

    <!-- Faint grid -->
    <pattern id="h-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#A78BFA" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="1200" height="420" fill="url(#h-bg)"/>
  <rect width="1200" height="420" fill="url(#h-grid)"/>
  <rect width="1200" height="420" fill="url(#h-aurora-a)"/>
  <rect width="1200" height="420" fill="url(#h-aurora-b)"/>
  <rect width="1200" height="420" fill="url(#h-halo)"/>

  <!-- ── Memory mark (scaled 2x from logo-mark.svg geometry) ── -->
  <g opacity="0.97">
    <!-- glow under the center node -->
    <circle cx="600" cy="140" r="58" fill="#A78BFA" opacity="0.15"/>
    <circle cx="600" cy="140" r="34" fill="#A78BFA" opacity="0.20"/>

    <!-- connector lines -->
    <line x1="532" y1="58" x2="600" y2="140" stroke="#C4B5FD" stroke-width="4"
          stroke-linecap="round" opacity="0.72"/>
    <line x1="668" y1="58" x2="600" y2="140" stroke="#C4B5FD" stroke-width="4"
          stroke-linecap="round" opacity="0.72"/>
    <line x1="532" y1="58" x2="668" y2="58" stroke="#DDD6FE" stroke-width="3"
          stroke-linecap="round" opacity="0.40"/>

    <!-- source nodes (L1 / L2) -->
    <circle cx="532" cy="58" r="10.5" fill="#F5F3FF"/>
    <circle cx="668" cy="58" r="10.5" fill="#F5F3FF"/>

    <!-- center node (L3) -->
    <circle cx="600" cy="140" r="14" fill="url(#h-node)"/>
    <circle cx="600" cy="140" r="6.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" opacity="0.95"/>
    <circle cx="600" cy="140" r="2.8" fill="#EDE9FE"/>
  </g>

  <!-- ── Wordmark ── -->
  <text x="600" y="272" text-anchor="middle"
        font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="78" font-weight="800" letter-spacing="-2.4" fill="url(#h-mark)">Thinkback</text>

  <!-- ── Tagline ── -->
  <text x="600" y="316" text-anchor="middle"
        font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="21" font-weight="500" letter-spacing="0.2" fill="#C4B5FD" opacity="0.94">Self-hosted memory service for AI conversations</text>

  <!-- ── Layer pill row ── -->
  <g font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
     font-size="12.5" font-weight="600" letter-spacing="0.6" fill="#DDD6FE">
    <!-- L1 -->
    <rect x="418" y="340" width="112" height="30" rx="15" fill="#7C3AED" fill-opacity="0.16"
          stroke="#A78BFA" stroke-opacity="0.42"/>
    <text x="474" y="359" text-anchor="middle">L1 JOURNAL</text>
    <!-- L2 -->
    <rect x="544" y="340" width="112" height="30" rx="15" fill="#7C3AED" fill-opacity="0.16"
          stroke="#A78BFA" stroke-opacity="0.42"/>
    <text x="600" y="359" text-anchor="middle">L2 SUMMARY</text>
    <!-- L3 -->
    <rect x="670" y="340" width="112" height="30" rx="15" fill="#7C3AED" fill-opacity="0.16"
          stroke="#A78BFA" stroke-opacity="0.42"/>
    <text x="726" y="359" text-anchor="middle">L3 LONG-TERM</text>
  </g>

  <!-- ── Bottom edge rule ── -->
  <rect x="0" y="414" width="1200" height="3" fill="url(#h-edge)"/>

  <!-- Vignette on top of everything -->
  <rect width="1200" height="420" fill="url(#h-vig)"/>
</svg>